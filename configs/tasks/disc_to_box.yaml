# Tarea: coger un disco y dejarlo dentro de una caja abierta.
# Diseñada para la precisión de una webcam (~7 cm de error): objeto grande y
# redondo (no importa el giro) y caja amplia.

name: disc_to_box

disc:
  radius: 0.030        # m -> 60 mm de diámetro (la pinza abre hasta 80 mm)
  half_height: 0.015   # m -> 30 mm de alto
  mass: 0.10           # kg
  friction: 1.5        # alto para que no resbale entre los dedos
  # condim 4 = además de deslizar, el contacto resiste GIRAR. Sin esto, el disco
  # pivotaba entre los dedos como un péndulo y se caía (98 % -> 99 % de éxito)
  condim: 4
  torsional_friction: 0.01
  rgba: [0.90, 0.30, 0.10, 1.0]

box:
  inner_size: 0.20     # m, lado interior (cuadrada)
  wall_height: 0.05    # m
  wall_thickness: 0.01 # m
  rgba: [0.20, 0.50, 0.90, 1.0]

# Aleatorización al empezar cada episodio: centro (x, y) en metros, en el
# marco del mundo (la base del robot está en el origen, mirando a +x).
# Rangos que no se solapan: el disco a la derecha (y<0), la caja a la izquierda.
randomization:
  disc_x: [0.40, 0.60]
  disc_y: [-0.25, -0.05]
  box_x:  [0.40, 0.60]
  box_y:  [0.15, 0.30]

# Semillas: cada semilla genera una disposición. Los rangos NO se solapan,
# así la evaluación es siempre en disposiciones que no se vieron al entrenar.
seeds:
  train_start: 0
  test_start: 100000

# Éxito: el centro del disco dentro del interior de la caja (con margen)
# y apoyado (por debajo de la altura de las paredes).
success:
  margin: 0.01         # m que restamos al interior para no contar el borde

# Cámaras fijas de la escena (la de muñeca es del robot: está en panda.yaml)
cameras:
  front:
    pos: [0.95, 0.0, 1.10]     # m: delante del robot y en alto
    target: [0.50, 0.03, 0.05] # m: punto al que mira (centro de la zona de trabajo)
    fovy: 45

# Resolución de las imágenes que verá la política (cuadradas)
image_size: 128

# Frecuencia de control: cuántas decisiones por segundo (y frames por segundo
# en los datos grabados). 25 Hz = una decisión cada 40 ms.
control_fps: 25
# Tiempo máximo por episodio (s): si no termina, cuenta como fallo
max_episode_time: 15.0
# Instrucción en texto que se guarda con cada demo (formato LeRobot)
instruction: "pick up the orange disc and place it in the blue box"
