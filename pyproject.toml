[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "handteleop"
version = "0.1.0"
description = "Hand teleoperation (webcam + MediaPipe) and imitation learning in MuJoCo"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
include = ["handteleop*"]
